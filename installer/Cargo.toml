[package]
name = "typeflow-setup"
version = "0.2.1"
edition = "2021"
description = "Installer for TypeFlow: one exe that carries the app and installs it for the current user."
license = "MIT"
build = "build.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
