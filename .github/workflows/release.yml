name: Release

# Push a tag like v0.2.0 to build TypeFlow-Setup.exe (installer) and TypeFlow.exe
# (portable) and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build app
        run: cargo build --release --locked
      - name: Build installer
        working-directory: installer
        env:
          TYPEFLOW_EXE: ${{ github.workspace }}\target\release\typeflow.exe
        run: cargo build --release --locked
      - name: Collect
        shell: bash
        run: |
          cp target/release/typeflow.exe TypeFlow.exe
          cp installer/target/release/typeflow-setup.exe TypeFlow-Setup.exe
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TypeFlow
          path: |
            TypeFlow-Setup.exe
            TypeFlow.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TypeFlow-Setup.exe
            TypeFlow.exe
          generate_release_notes: true
