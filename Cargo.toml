[package]
name = "typeflow"
version = "0.2.0"
edition = "2021"
description = "Smart language switcher for Windows: shows a hint when a word was typed with the wrong keyboard layout (English <-> Persian) on Windows."
license = "MIT AND CC-BY-SA-4.0 AND OFL-1.1"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1
